# Rappels par e-mail des tâches (TACHES.md) — voir app/README.md, section « Rappels par e-mail ».
# Toutes les heures (minute 7) : lit TACHES.md sur main, envoie au plus 3 mails par jour via Resend
# à l'unique adresse du secret REMINDER_TO. L'état des envois (anti-doublon) est gardé dans sent.json
# sur la branche « rappels-etat » (jamais dans TACHES.md). Aucune dépendance n'est installée.
name: Rappels

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer un mail de test"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rappels
  cancel-in-progress: false

jobs:
  rappels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Lire l'état des envois
        run: |
          if git fetch --depth=1 -q origin rappels-etat:refs/remotes/origin/rappels-etat 2>/dev/null; then
            git show origin/rappels-etat:sent.json > "$RUNNER_TEMP/sent.json" || echo '{}' > "$RUNNER_TEMP/sent.json"
          else
            echo '{}' > "$RUNNER_TEMP/sent.json"
          fi

      - name: Envoyer les rappels
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REMINDER_TO: ${{ secrets.REMINDER_TO }}
          TEST_FLAG: ${{ inputs.test && '--test' || '' }}
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON app/scripts/send-reminders.ts TACHES.md "$RUNNER_TEMP/sent.json" $TEST_FLAG

      - name: Garder l'état des envois
        if: always()
        env:
          GIT_AUTHOR_NAME: rappels
          GIT_AUTHOR_EMAIL: rappels@users.noreply.github.com
          GIT_COMMITTER_NAME: rappels
          GIT_COMMITTER_EMAIL: rappels@users.noreply.github.com
        run: |
          [ -s "$RUNNER_TEMP/sent.json" ] || exit 0
          blob=$(git hash-object -w "$RUNNER_TEMP/sent.json")
          tree=$(printf '100644 blob %s\tsent.json\n' "$blob" | git mktree)
          if parent=$(git rev-parse -q --verify origin/rappels-etat); then
            [ "$(git rev-parse "origin/rappels-etat^{tree}")" = "$tree" ] && { echo "État inchangé."; exit 0; }
            commit=$(git commit-tree "$tree" -p "$parent" -m "Rappels : état des envois")
          else
            commit=$(git commit-tree "$tree" -m "Rappels : état des envois")
          fi
          git push -q origin "$commit:refs/heads/rappels-etat"
